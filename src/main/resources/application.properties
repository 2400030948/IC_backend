server.port=${PORT:5000}
spring.application.name=backend-ic
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ic_project_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ic_user}
spring.datasource.password=${DB_PASSWORD:ic_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
