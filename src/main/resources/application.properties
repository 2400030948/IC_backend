server.port=5000
spring.application.name=backend-ic
app.cors.allowed-origin=http://localhost:5173

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ic_project_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ic_user}
spring.datasource.password=${DB_PASSWORD:ic_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
